name: Aider Automated Biographer

on:
  push:
    branches:
      - main

jobs:
  update-biography:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Aider CLI
        run: |
          cd cli
          npm install
          npm run build
          cd ..

      - name: Run Aider Hook
        env:
          AIDER_API_URL: https://aider-backend-1047791816785.us-central1.run.app/api/commit
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node cli/dist/index.js run-hook temp-msg.txt --diff HEAD~1

      - name: Commit and Push README Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "docs: auto-update architecture diagram [skip ci]"
            git push
          else
            echo "No changes in README.md"
          fi
