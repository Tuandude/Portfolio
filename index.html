<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & SEO -->
    <title>Tuan Dang — Portfolio</title>
    <meta name="description" content="Tuan Dang — AI Student & Vibe Coder based in Ho Chi Minh City. Explore projects, skills, and get in touch." />
    <meta name="author" content="Đặng Văn Bảo Tuấn" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tuan Dang — Portfolio" />
    <meta property="og:description" content="AI Student & Vibe Coder based in Ho Chi Minh City." />
    <meta property="og:url" content="https://tuandang.dev" />
    <meta property="og:image" content="https://tuandang.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tuan Dang — Portfolio" />
    <meta name="twitter:description" content="AI Student & Vibe Coder based in Ho Chi Minh City." />
    <meta name="twitter:image" content="https://tuandang.dev/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Font Preload: LCP-critical fonts only -->
    <!-- Instrument Serif italic (hero heading) -->
    <link
      rel="preload"
      href="/fonts/instrument-serif-latin-400-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Inter variable (hero body text) -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0A0A0A" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
