<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#141414" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F4F1EA" />
  <rect width="1200" height="630" fill="url(#dot-grid)" />

  <!-- Outer Swiss Hairline Border -->
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#DCD7CD" stroke-width="1.5" />

  <!-- Top metadata bar -->
  <line x1="32" y1="96" x2="1168" y2="96" stroke="#DCD7CD" stroke-width="1.5" />
  <text x="64" y="72" font-family="'Courier New', monospace" font-size="14" fill="#58554F" letter-spacing="2">
    TUAN DANG // RESEARCH NOTEBOOK &amp; PORTFOLIO
  </text>
  <text x="1040" y="72" font-family="'Courier New', monospace" font-size="14" fill="#BA3600" font-weight="bold" letter-spacing="1">
    [SYS_REV: 2026]
  </text>

  <!-- Monogram Box -->
  <rect x="64" y="140" width="72" height="72" rx="4" fill="#141414" />
  <rect x="66" y="142" width="68" height="68" rx="3" fill="none" stroke="#333333" stroke-width="1" />
  <text x="80" y="186" font-family="'Courier New', monospace" font-size="32" font-weight="bold" fill="#F4F1EA">TD</text>
  <circle cx="120" cy="196" r="5" fill="#FF4F00" />

  <!-- Main Headline -->
  <text x="64" y="270" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#58554F" letter-spacing="2">
    ĐẶNG VĂN BẢO TUẤN · TUAN DANG
  </text>
  <text x="64" y="360" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="64" font-weight="bold" fill="#141414" letter-spacing="-1">
    AI Student · Vibe Coder · Builder
  </text>

  <!-- Tagline / Bio summary -->
  <text x="64" y="420" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" fill="#58554F">
    Machine Learning · Deep Learning · Computer Vision · Modern Web
  </text>

  <!-- Bottom Details Bar -->
  <line x1="32" y1="520" x2="1168" y2="520" stroke="#DCD7CD" stroke-width="1.5" />
  <circle cx="70" cy="558" r="4" fill="#FF4F00" />
  <text x="86" y="563" font-family="'Courier New', monospace" font-size="15" fill="#141414">
    AVAILABLE FOR INTERNSHIP · DA NANG, VIETNAM
  </text>
  <text x="960" y="563" font-family="'Courier New', monospace" font-size="15" fill="#58554F">
    tuandang.dev
