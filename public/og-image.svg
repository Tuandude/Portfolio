<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89AACC" />
      <stop offset="100%" stop-color="#4E85BF" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#8A8A8A" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g stroke="#1F1F1F" stroke-width="1" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="530" x2="1200" y2="530" />
  </g>

  <!-- Glowing background orb -->
  <circle cx="950" cy="200" r="300" fill="#89AACC" opacity="0.08" filter="blur(60px)" />
  <circle cx="250" cy="450" r="250" fill="#4E85BF" opacity="0.06" filter="blur(60px)" />

  <!-- Badge -->
  <g transform="translate(140, 160)">
    <rect width="320" height="36" rx="18" fill="#141414" stroke="#1F1F1F" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#34D399" />
    <text x="36" y="23" fill="#8A8A8A" font-family="monospace" font-size="12" letter-spacing="2">AVAILABLE FOR OPPORTUNITIES</text>
  </g>

  <!-- Name -->
  <text x="140" y="320" fill="url(#textGrad)" font-family="serif" font-style="italic" font-size="110" font-weight="bold" letter-spacing="-2">Tuan Dang</text>

  <!-- Tagline -->
  <text x="140" y="390" fill="#8A8A8A" font-family="sans-serif" font-size="32" font-weight="300">
    AI Student <tspan fill="url(#accent)">·</tspan> Vibe Coder <tspan fill="url(#accent)">·</tspan> Builder
  </text>

  <!-- Location & Footer -->
  <text x="140" y="490" fill="#757575" font-family="monospace" font-size="16" letter-spacing="1">
    // Ho Chi Minh City, Vietnam — https://tuandang.dev
  </text>
</svg>
